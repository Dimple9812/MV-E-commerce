{{- if .Values.metrics.serviceMonitor }}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "marketflow.labels" $root | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "marketflow.selector" (dict "name" $name "root" $root) | nindent 6 }}
  endpoints:
    - port: {{ if $svc.managementPort }}management{{ else }}http{{ end }}
      path: /actuator/prometheus
      interval: 15s
{{- end }}
{{- end }}
