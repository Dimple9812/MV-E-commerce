{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "marketflow.labels" . | nindent 4 }}
    {{- include "marketflow.selector" (dict "name" "frontend" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "marketflow.selector" (dict "name" "frontend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "marketflow.selector" (dict "name" "frontend" "root" .) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "marketflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "marketflow.image" (dict "name" "frontend" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: GATEWAY_UPSTREAM, value: "http://gateway-service:8080" }
          ports:
            - { name: http, containerPort: {{ .Values.frontend.port }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # nginx renders its config template and keeps temp files here; the root filesystem stays read-only
            - { name: conf, mountPath: /etc/nginx/conf.d }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: conf, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "marketflow.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "marketflow.selector" (dict "name" "frontend" "root" .) | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
{{- end }}
