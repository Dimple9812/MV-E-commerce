apiVersion: v1
kind: ConfigMap
metadata:
  name: marketflow-common
  labels:
    {{- include "marketflow.labels" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.global.kafkaBootstrapServers | quote }}
  REDIS_HOST: {{ .Values.global.redisHost | quote }}
  REDIS_PORT: {{ .Values.global.redisPort | quote }}
  JWT_ISSUER: {{ .Values.global.jwtIssuer | quote }}
  JWT_JWK_SET_URI: "http://identity-service:8081/.well-known/jwks.json"
  TRACING_ENABLED: {{ .Values.global.tracing.enabled | quote }}
  TRACING_SAMPLING: {{ .Values.global.tracing.sampling | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.tracing.otlpEndpoint | quote }}
  LOG_FORMAT: {{ .Values.global.logFormat | quote }}
  CORS_ALLOWED_ORIGINS: {{ printf "https://%s" .Values.ingress.host | quote }}
  PASSWORD_RESET_URL: {{ printf "https://%s/reset-password" .Values.ingress.host | quote }}
