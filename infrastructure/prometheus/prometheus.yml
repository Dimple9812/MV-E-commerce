global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: marketflow-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - identity-service:8081
          - vendor-service:8082
          - catalog-service:8083
          - inventory-service:8084
          - order-service:8085
          - payment-service:8086
          - notification-service:8087
          - review-service:8088
          - analytics-service:8089
  - job_name: marketflow-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway-service:8090]
