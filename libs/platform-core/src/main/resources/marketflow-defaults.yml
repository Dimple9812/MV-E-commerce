# Lowest-precedence defaults shared by every servlet service. Override in a service's application.yml
# or with environment variables (e.g. SPRING_KAFKA_BOOTSTRAP_SERVERS).
server:
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 2MB
    connection-timeout: 10s
    # longer than the gateway's pool max-idle-time (20 s) so the client side always closes idle connections first
    keep-alive-timeout: 30s
    max-keep-alive-requests: 10000
  error:
    include-stacktrace: never
    include-message: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        max.poll.records: 50
        isolation.level: read_committed
    listener:
      ack-mode: record
      observation-enabled: true
    template:
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://marketflow.dev/identity}
          audiences: marketflow-api

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        saga.duration: true
        payment.provider.calls: true
      # bound the bucket range so histograms stay small (SLO-relevant range only)
      minimum-expected-value:
        saga.duration: 50ms
        payment.provider.calls: 5ms
      maximum-expected-value:
        saga.duration: 120s
        payment.provider.calls: 10s
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      # "logstash" JSON in containers; set LOG_FORMAT= (empty) for human-readable local logs
      console: ${LOG_FORMAT:logstash}
  level:
    root: INFO
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

marketflow:
  kafka:
    max-retries: 4
  outbox:
    # 8 outbox hops per confirmed checkout: at 500 ms the saga p95 was 4.3 s, at 100 ms 1.1 s (load-tests/README.md)
    poll-interval: 100ms
