server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:https://marketflow.dev/identity}
          audiences: marketflow-api
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 15s
            # Pooled connections must be retired before the downstream Tomcat closes them (keep-alive-timeout
            # 30 s in marketflow-defaults.yml); otherwise a request can be written to a connection the server
            # is closing ("Connection prematurely closed BEFORE response"), which also trips circuit breakers.
            pool:
              max-idle-time: 20s
              max-life-time: 5m
              eviction-interval: 5s
          x-forwarded:
            enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # A full bulkhead is the gateway shedding its own excess load, not a sign the downstream is broken:
        # counting it as a failure opened the breaker under ordinary load in the k6 test (load-tests/README.md).
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
  # Spring Cloud CircuitBreaker puts a semaphore bulkhead in front of every route (default 25 concurrent calls).
  # Size it to what one downstream instance serves (Tomcat: 200 threads, Hikari: 10-20 connections).
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 150
        max-wait-duration: 50ms
  timelimiter:
    configs:
      default:
        timeout-duration: 15s

marketflow:
  gateway:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    max-request-size: 2MB
    downstream-timeout: 15s
    default-rate-limit:
      replenish-rate: ${RATE_LIMIT_RPS:20}
      burst-capacity: ${RATE_LIMIT_BURST:40}
    auth-rate-limit:
      replenish-rate: ${AUTH_RATE_LIMIT_RPS:5}
      burst-capacity: ${AUTH_RATE_LIMIT_BURST:10}
    services:
      identity: ${IDENTITY_URI:http://localhost:8081}
      vendor: ${VENDOR_URI:http://localhost:8082}
      catalog: ${CATALOG_URI:http://localhost:8083}
      inventory: ${INVENTORY_URI:http://localhost:8084}
      order: ${ORDER_URI:http://localhost:8085}
      payment: ${PAYMENT_URI:http://localhost:8086}
      notification: ${NOTIFICATION_URI:http://localhost:8087}
      review: ${REVIEW_URI:http://localhost:8088}
      analytics: ${ANALYTICS_URI:http://localhost:8089}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  server:
    port: ${MANAGEMENT_PORT:8090}   # metrics are scraped on a separate, non-public port
  metrics:
    tags:
      application: gateway-service
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
  level:
    org.springframework.cloud.gateway: INFO
