server:
  port: ${PORT:8083}

spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:catalog_svc}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
  task:
    scheduling:
      pool:
        size: 4

management:
  health:
    redis:
      enabled: false   # Redis is an optimisation for catalog; its outage must not mark the service DOWN

marketflow:
  kafka:
    produces: catalog.product.events,platform.audit.events
    consumes: vendor.events,inventory.events,review.events
  catalog:
    image-dir: ${IMAGE_DIR:./data/images}
    image-url-prefix: /api/v1/products/images/
