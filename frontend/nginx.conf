# Host part of the Origin header ("" when absent or malformed).
map $http_origin $mf_origin_host {
    default "";
    "~^https?://(?<origin_host>[^/]+)$" $origin_host;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 6m;   # product image uploads are capped at 5 MB by catalog-service

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        # The browser only calls /api on the origin it loaded the page from, so the request is same-origin by
        # construction. Check that here against whatever host name the page was opened on (localhost:3000, a
        # tunnel or a server's domain) and drop the Origin header, so the gateway's CORS allow-list does not have
        # to know every public host name. Cross-site requests are still refused.
        set $mf_cross_site 0;
        if ($http_origin != "") { set $mf_cross_site 1; }
        if ($mf_origin_host = $http_host) { set $mf_cross_site 0; }
        if ($mf_cross_site) { return 403; }
        proxy_set_header Origin "";
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build output never changes: cache it for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which must always be revalidated.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
