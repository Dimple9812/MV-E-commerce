name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Unit tests
        run: mvn -B -ntp test
      # Integration tests (*IT) use Testcontainers: PostgreSQL 16 and Redis 7 containers, embedded Kafka (KRaft).
      - name: Integration tests
        run: mvn -B -ntp verify -Dsurefire.skip=true
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
            libs/*/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy-config:
    name: Helm chart, Compose and event contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: helm lint and schema validation
        run: |
          CHART=infrastructure/helm/marketflow
          for values in "" "-f $CHART/values-dev.yaml" "-f $CHART/values-prod.yaml"; do
            helm lint $CHART $values
            helm template mf $CHART $values | kubeconform -strict -summary -kubernetes-version 1.30.0 -skip ServiceMonitor
          done
      - name: docker compose config
        run: cp .env.example .env && docker compose config -q
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Event contracts are generated and examples validate
        run: |
          pip install jsonschema==4.23.0
          python3 contracts/events/generate.py
          git diff --exit-code -- contracts/events || { echo "contracts/events is stale: run contracts/events/generate.py"; exit 1; }
          python3 scripts/validate-contracts.py

  security:
    name: Dependency and static security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan (dependencies, secrets, IaC misconfiguration)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: frontend/node_modules
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: DL3018

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Build Java
        if: matrix.language == 'java-kotlin'
        run: mvn -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@v3

  images:
    name: Image ${{ matrix.image }}
    needs: [backend, frontend, deploy-config, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [gateway-service, identity-service, vendor-service, catalog-service, inventory-service,
                order-service, payment-service, notification-service, review-service, analytics-service, frontend]
    env:
      # Images are pushed only from main, after every check above passed, and only when the repository opts in
      # (Settings > Variables: PUBLISH_IMAGES=true). Otherwise they are built to prove the Dockerfiles work.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_IMAGES == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build${{ env.PUSH == 'true' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image == 'frontend' && 'frontend' || '.' }}
          file: ${{ matrix.image == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.image) }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
