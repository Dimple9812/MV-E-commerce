name: End-to-end

# Starts the whole Docker Compose stack, seeds demo data and runs the API and browser end-to-end suites.
# Heavier than CI, so it runs nightly and on demand.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate a throwaway .env
        run: ./scripts/init-env.sh
      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Seed demo data
        run: |
          node scripts/seed-demo.mjs
      - name: API end-to-end checks
        run: |
          node scripts/e2e-checkout.mjs
      - name: Browser end-to-end tests
        working-directory: frontend
        run: |
          set -a; source ../.env; set +a
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 E2E_ADMIN_EMAIL=$BOOTSTRAP_ADMIN_EMAIL E2E_ADMIN_PASSWORD=$BOOTSTRAP_ADMIN_PASSWORD npx playwright test
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose-logs.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            compose-logs.txt
            frontend/playwright-report
            frontend/test-results
      - name: Stop the stack
        if: always()
        run: docker compose down -v
