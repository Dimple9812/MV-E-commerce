# MarketFlow local development stack.
#
#   cp .env.example .env        # then replace every change-me value
#   docker compose up --build -d
#   node scripts/seed-demo.mjs  # optional demo sellers, products and customers
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and DELETE all volumes (databases, Kafka log, Grafana state)
#
# Kafka runs as a single KRaft node (combined broker + controller, no ZooKeeper). Topics are created by the
# services at start-up (auto-creation is disabled, as it should be in production).

name: marketflow

x-restart: &restart
  restart: unless-stopped

x-java-env: &java-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
  JWT_ISSUER: ${JWT_ISSUER:-https://marketflow.dev/identity}
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  TRACING_SAMPLING: ${TRACING_SAMPLING:-1.0}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  LOG_FORMAT: ${LOG_FORMAT:-logstash}
  # MF_JAVA_OPTS in .env overrides this, e.g. the low-resource settings in the README.
  JAVA_TOOL_OPTIONS: ${MF_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}

x-java-deps: &java-deps
  postgres: { condition: service_healthy }
  kafka: { condition: service_healthy }

x-java-limits: &java-limits
  # tini as PID 1: the JVM does not reap child processes, so health-check commands that time out on a slow host
  # pile up as zombies and Docker Desktop then cannot stop the container.
  init: true
  deploy:
    resources:
      limits: { memory: 640m }
  # The health check command comes from each image's Dockerfile; only the timing is overridden here. Ten JVMs
  # starting together under Docker Desktop can each take many minutes (observed: up to 10). Failures during
  # start_period do not count, and a service turns healthy as soon as one check passes, so a long window costs nothing
  # on a fast machine.
  healthcheck:
    start_period: 900s
    interval: 15s
    timeout: 15s
    retries: 10

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    init: true   # tini as PID 1 reaps leftover health-check processes so the container can always be stopped
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?}
      VENDOR_DB_PASSWORD: ${VENDOR_DB_PASSWORD:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?add CHAT_DB_PASSWORD to .env (see .env.example)}
    # The init script is copied with Windows line endings stripped: on a Windows checkout with
    # core.autocrlf=true it would otherwise fail inside the Linux container and postgres would never get healthy.
    entrypoint:
      - bash
      - -c
      # ensure-service-database.sh creates databases added after the volume was first initialised (chat_db) on
      # existing installations; it waits for the real server (TCP; the init-time server only listens on a socket)
      # and is a no-op when the init script already created everything.
      - 'tr -d "\r" < /init-src/01-create-service-databases.sh > /docker-entrypoint-initdb.d/01-create-service-databases.sh && chmod 755 /docker-entrypoint-initdb.d/01-create-service-databases.sh && tr -d "\r" < /ensure-src/ensure-service-database.sh > /tmp/ensure-service-database.sh && (until pg_isready -q -h 127.0.0.1 -U postgres; do sleep 2; done; PGHOST=127.0.0.1 PGUSER=postgres PGPASSWORD="$$POSTGRES_PASSWORD" bash /tmp/ensure-service-database.sh chat_db chat_svc "$$CHAT_DB_PASSWORD") & exec docker-entrypoint.sh postgres'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/init-src:ro
      - ./infrastructure/postgres/ensure-service-database.sh:/ensure-src/ensure-service-database.sh:ro
    # No host port: services reach it on the Compose network, and a PostgreSQL installed on the host would
    # clash with 5432. Set POSTGRES_HOST_PORT in .env and uncomment to connect a desktop SQL client.
    # ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"SELECT 1 FROM pg_database WHERE datname='chat_db'\" | grep -q 1"]
      # Generous timeouts: on a busy Docker Desktop host the check itself can take seconds, and a timed-out
      # check marks a perfectly working database unhealthy.
      interval: 10s
      timeout: 30s
      retries: 30

  kafka:
    init: true   # tini as PID 1 reaps leftover health-check processes so the container can always be stopped
    image: apache/kafka:3.9.1
    <<: *restart
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"]   # for scripts/dlt-replay.mjs on the host
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      # The check starts a JVM, so it is slow on a loaded host; check less often and allow it longer.
      interval: 30s
      timeout: 60s
      retries: 20
      start_period: 120s

  redis:
    init: true   # tini as PID 1 reaps leftover health-check processes so the container can always be stopped
    image: redis:7.4-alpine
    <<: *restart
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    # No host port: only the services use Redis, and 6379 is often taken by a locally installed Redis.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 15s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    <<: *restart
    ports: ["127.0.0.1:8025:8025"]   # web UI; SMTP stays on the internal network (1025)

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    <<: *restart
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.3.1
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  # ---------------------------------------------------------------- application services
  identity-service:
    build: { context: ., dockerfile: services/identity-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_svc
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      REDIS_HOST: redis
      # Leave JWT_PRIVATE_KEY_PEM empty in development: identity generates an ephemeral RSA key at start-up
      # (sessions end when it restarts). Production must supply a persistent key from a secret store.
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      MARKETFLOW_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      MARKETFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MAIL_MODE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      PASSWORD_RESET_URL: http://localhost:3000/reset-password
    depends_on:
      <<: *java-deps
      redis: { condition: service_healthy }

  vendor-service:
    build: { context: ., dockerfile: services/vendor-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/vendor_db
      DB_USERNAME: vendor_svc
      DB_PASSWORD: ${VENDOR_DB_PASSWORD}
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  catalog-service:
    build: { context: ., dockerfile: services/catalog-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog_svc
      DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      REDIS_HOST: redis
      IMAGE_DIR: /data/images
    volumes:
      - catalog-images:/data/images
    depends_on:
      <<: *java-deps
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }

  inventory-service:
    build: { context: ., dockerfile: services/inventory-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_svc
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  order-service:
    build: { context: ., dockerfile: services/order-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/order_db
      DB_USERNAME: order_svc
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  payment-service:
    build: { context: ., dockerfile: services/payment-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_svc
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
      SANDBOX_WEBHOOK_URL: http://payment-service:8086
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  notification-service:
    build: { context: ., dockerfile: services/notification-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification_svc
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      MAIL_MODE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # "+bounce" / "+flaky" recipient tags simulate delivery failures (retry and DLT demos); off in production.
      NOTIFICATION_FAULT_INJECTION: ${NOTIFICATION_FAULT_INJECTION:-true}
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  review-service:
    build: { context: ., dockerfile: services/review-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/review_db
      DB_USERNAME: review_svc
      DB_PASSWORD: ${REVIEW_DB_PASSWORD}
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  analytics-service:
    build: { context: ., dockerfile: services/analytics-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/analytics_db
      DB_USERNAME: analytics_svc
      DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    depends_on:
      <<: *java-deps
      identity-service: { condition: service_healthy }

  chat-service:
    build: { context: ., dockerfile: services/chat-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/chat_db
      DB_USERNAME: chat_svc
      DB_PASSWORD: ${CHAT_DB_PASSWORD}
      REDIS_HOST: redis
      # direct WebSocket connections (Vite dev server, the gateway's own port); behind the storefront's nginx the
      # Origin is checked there and removed
      CHAT_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-3000},http://127.0.0.1:${FRONTEND_HOST_PORT:-3000},http://localhost:5173
    depends_on:
      <<: *java-deps
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }

  gateway-service:
    build: { context: ., dockerfile: services/gateway-service/Dockerfile }
    <<: [*restart, *java-limits]
    environment:
      JWT_JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json
      JWT_ISSUER: ${JWT_ISSUER:-https://marketflow.dev/identity}
      REDIS_HOST: redis
      IDENTITY_URI: http://identity-service:8081
      VENDOR_URI: http://vendor-service:8082
      CATALOG_URI: http://catalog-service:8083
      INVENTORY_URI: http://inventory-service:8084
      ORDER_URI: http://order-service:8085
      PAYMENT_URI: http://payment-service:8086
      NOTIFICATION_URI: http://notification-service:8087
      REVIEW_URI: http://review-service:8088
      ANALYTICS_URI: http://analytics-service:8089
      CHAT_URI: http://chat-service:8091
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_HOST_PORT:-3000},http://127.0.0.1:${FRONTEND_HOST_PORT:-3000},http://localhost:5173
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_FORMAT: ${LOG_FORMAT:-logstash}
      JAVA_TOOL_OPTIONS: ${MF_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }

  frontend:
    build: { context: ./frontend }
    <<: *restart
    environment:
      GATEWAY_UPSTREAM: http://gateway-service:8080
    # FRONTEND_HOST_PORT if 3000 is taken; FRONTEND_BIND=0.0.0.0 only on a server that should be public
    ports: ["${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_HOST_PORT:-3000}:8080"]
    depends_on:
      # Started, not healthy: nginx only needs the gateway's name to resolve, and the page shows an error until the
      # gateway answers, instead of the whole start-up failing on a slow machine.
      gateway-service: { condition: service_started }

volumes:
  pg-data:
  kafka-data:
  prometheus-data:
  grafana-data:
  catalog-images:
